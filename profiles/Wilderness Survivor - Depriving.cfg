Sandbox Preset=Wilderness Depriving
Version=6

# =========================================================
# WILDERNESS DEPRIVING
# Harsh wilderness / Naked and Afraid experience.
# Civilization is tremendously dangerous.
# =========================================================

# --- WORLD ---
StartMonth=3
StartDay=1

# B42 has no 6 AM selection. 9 = 5 AM.
StartTime=9
DayLength=3

# Civilization is essentially dead already
WaterShut=1
ElecShut=1

Temperature=2
Rain=4
ErosionSpeed=2

# Slow agriculture, but don't artificially cripple wild food
Farming=4
PlantResilience=3
PlantAbundance=3
NatureAbundance=3

StarterKit=false

# --- WILDERNESS SURVIVOR ---
WildernessSurvivor.EnableSleepShelterRule=true
WildernessSurvivor.StartingItemsPreset=4
WildernessSurvivor.CompassOpensMinimap=2

HoursForLootRespawn=0
SeenHoursPreventLootRespawn=0

# --- LOOT ---
# Towns are enormously dangerous AND badly picked over.
# Anything manufactured should feel precious.

FoodLootNew=0.05
CannedFoodLootNew=0.05

LiteratureLootNew=0.05
SkillBookLoot=0.05
RecipeResourceLoot=0.05

MedicalLootNew=0.05

# Slightly higher than the absolute floor so things like
# tents/fishing equipment can still occasionally reward an expedition.
SurvivalGearsLootNew=0.20

WeaponLootNew=0.05
RangedWeaponLootNew=0.05
AmmoLootNew=0.05

MechanicsLootNew=0.05
ToolLootNew=0.05
MaterialLootNew=0.05
FarmingLootNew=0.05
CookwareLootNew=0.05
ContainerLootNew=0.05
ClothingLootNew=0.20
KeyLootNew=0.05
OtherLootNew=0.05

# --- VEHICLES ---
EnableVehicles=true
CarSpawnRate=2
VehicleEasyUse=false

InitialGas=1
CarGeneralCondition=1
ChanceHasGas=1
LockedCar=6

FuelStationGasInfinite=false
FuelStationGasMin=0.0
FuelStationGasMax=0.10
FuelStationGasEmptyChance=75

# --- ANIMALS ---
# Wilderness still needs to be a viable solution.
AnimalRanchChance=3
AnimalStatsModifier=4
AnimalMetaStatsModifier=4
AnimalPregnancyTime=4
AnimalAgeModifier=4
AnimalGrassRegrowTime=300

# --- PLAYER CONSTRUCTION ---
# Defenses themselves remain normal instead of becoming
# arbitrarily fragile just because difficulty increased.
ConstructionBonusPoints=3

# --- ZOMBIES ---
Distribution=1
ZombieRespawn=4
ZombieMigrate=true

ZombieLore.Speed=3
ZombieLore.Strength=2
ZombieLore.Toughness=2

ZombieLore.Memory=1
ZombieLore.Sight=2
ZombieLore.Hearing=2

ZombieLore.Cognition=3
ZombieLore.ThumpOnConstruction=true
ZombieLore.ZombiesDragDown=true
ZombieLore.ZombiesFenceLunge=true

# Urban-focused distribution + this population is what makes
# entering a real town frightening.
ZombieConfig.PopulationMultiplier=1.20
ZombieConfig.PopulationStartMultiplier=1.00
ZombieConfig.PopulationPeakMultiplier=1.75
ZombieConfig.PopulationPeakDay=28

ZombieConfig.RespawnHours=0.0
ZombieConfig.RespawnUnseenHours=0.0
ZombieConfig.RespawnMultiplier=0.0

# Existing populations refill cleared areas fairly aggressively.
ZombieConfig.RedistributeHours=6.0

# Noise in town is especially dangerous without giving zombies
# supernatural toughness.
ZombieConfig.FollowSoundDistance=200

ZombieConfig.RallyGroupSize=25
ZombieConfig.RallyGroupSizeVariance=50
ZombieConfig.RallyTravelDistance=25
ZombieConfig.RallyGroupSeparation=12
ZombieConfig.RallyGroupRadius=3