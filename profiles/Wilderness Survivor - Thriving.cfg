Sandbox Preset=Wilderness Thriving
Version=6

# =========================================================
# WILDERNESS THRIVING
# Comfortable/co-op wilderness experience.
# Intended starter preset: Wilderness Glamping
# =========================================================

# --- WORLD ---
StartMonth=4
StartDay=1
StartTime=1
DayLength=3

# 0-30 days water; 14-30 days electricity
WaterShut=2
ElecShut=2

Temperature=3
Rain=3
ErosionSpeed=2

# Normal farming, generous natural foraging
Farming=3
PlantResilience=3
PlantAbundance=4
NatureAbundance=5

# No vanilla starter kit -- custom mod supplies ours
StarterKit=false

# Never regenerate scavenged loot
HoursForLootRespawn=0
SeenHoursPreventLootRespawn=0

# --- LOOT ---
# Rare enough that town expeditions matter,
# but casual players generally find something useful.

FoodLootNew=0.6
CannedFoodLootNew=0.6
LiteratureLootNew=0.6
SkillBookLoot=0.6
RecipeResourceLoot=0.6
MedicalLootNew=0.6
SurvivalGearsLootNew=0.6

WeaponLootNew=0.2
RangedWeaponLootNew=0.2
AmmoLootNew=0.2

MechanicsLootNew=0.6
ToolLootNew=0.6
MaterialLootNew=0.6
FarmingLootNew=0.6
CookwareLootNew=0.6
ContainerLootNew=0.6
ClothingLootNew=0.6
KeyLootNew=0.6
OtherLootNew=0.6

# --- VEHICLES ---
EnableVehicles=true
CarSpawnRate=3
VehicleEasyUse=false

# Low starting fuel, reasonably repairable vehicles
InitialGas=2
CarGeneralCondition=3
ChanceHasGas=2
LockedCar=4

FuelStationGasInfinite=false
FuelStationGasMin=0.0
FuelStationGasMax=0.40
FuelStationGasEmptyChance=30

# --- ANIMALS ---
AnimalRanchChance=6
AnimalStatsModifier=5
AnimalMetaStatsModifier=5
AnimalPregnancyTime=4
AnimalAgeModifier=4
AnimalGrassRegrowTime=180

# --- PLAYER CONSTRUCTION ---
ConstructionBonusPoints=4

# --- ZOMBIES ---
Distribution=1
ZombieRespawn=4
ZombieMigrate=true

ZombieLore.Speed=3
ZombieLore.Strength=2
ZombieLore.Toughness=2
ZombieLore.Memory=2
ZombieLore.Sight=2
ZombieLore.Hearing=2
ZombieLore.Cognition=3
ZombieLore.ThumpOnConstruction=true
ZombieLore.ZombiesDragDown=true
ZombieLore.ZombiesFenceLunge=true

ZombieConfig.PopulationMultiplier=0.40
ZombieConfig.PopulationStartMultiplier=0.75
ZombieConfig.PopulationPeakMultiplier=1.10
ZombieConfig.PopulationPeakDay=28

ZombieConfig.RespawnHours=0.0
ZombieConfig.RespawnUnseenHours=0.0
ZombieConfig.RespawnMultiplier=0.0

ZombieConfig.RedistributeHours=24.0
ZombieConfig.FollowSoundDistance=100
ZombieConfig.RallyGroupSize=10
ZombieConfig.RallyTravelDistance=15
ZombieConfig.RallyGroupSeparation=20
ZombieConfig.RallyGroupRadius=3